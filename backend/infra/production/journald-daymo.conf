# /etc/systemd/journald.conf.d/daymo.conf
#
# 서버 기록을 3개월 안에 지운다(개인정보 처리방침 4항). 컨테이너 로그도
# compose.yml 의 journald 로깅으로 여기에 모인다.
#
# journald 는 파일 단위로 지운다. 파일 하나를 7일마다 끊고, 가장 새 기록이 80일을
# 넘은 파일을 지우면 어떤 기록도 87일을 넘기지 않는다.
[Journal]
Storage=persistent
MaxRetentionSec=80day
MaxFileSec=7day
SystemMaxUse=1G
