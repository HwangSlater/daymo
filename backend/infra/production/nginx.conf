limit_req_zone $binary_remote_addr zone=daymo_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=daymo_auth_pages:10m rate=1r/s;

# 메일 링크 주소에는 1회용 token 이 ?token= 으로 붙는다. 기본 형식은 주소 전체를
# 적으므로 /auth/ 에서는 ? 앞의 경로만 적는다.
log_format daymo_no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "-" "$http_user_agent"';

upstream daymo_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.daymo.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name api.daymo.xyz;

    ssl_certificate /etc/letsencrypt/live/api.daymo.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daymo.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20m;

    location = /health {
        proxy_pass http://daymo_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    location /v1/ {
        limit_req zone=daymo_api burst=30 nodelay;
        proxy_pass http://daymo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /auth/ {
        limit_req zone=daymo_auth_pages burst=10 nodelay;
        access_log /var/log/nginx/access.log daymo_no_query;
        proxy_pass http://daymo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        return 404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}
