# 앱이 여행 하나를 열 때 목록 9개와 사진 썸네일을 함께 받는다. 초당 10건으로는
# 한 화면을 여는 것만으로 걸려서, 여는 순간의 뭉치를 받아 줄 만큼 올린다.
limit_req_zone $binary_remote_addr zone=daymo_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=daymo_auth_pages:10m rate=1r/s;
limit_req_status 429;

# 429 를 돌려줄 때 CORS 머리를 붙일 주소. 앱 설정(CORS_ORIGINS)과 같게 둔다.
map $http_origin $daymo_cors_origin {
    default "";
    "https://www.daymo.xyz" $http_origin;
    "https://daymo.xyz" $http_origin;
    "https://daymo-preview.vercel.app" $http_origin;
}

# 메일 링크 주소에는 1회용 token 이 ?token= 으로 붙는다. 기본 형식은 주소 전체를
# 적으므로 /auth/ 에서는 ? 앞의 경로만 적는다.
log_format daymo_no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "-" "$http_user_agent"';

upstream daymo_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name api.daymo.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name api.daymo.xyz;

    ssl_certificate /etc/letsencrypt/live/api.daymo.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.daymo.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20m;

    # JSON 응답을 압축해서 보낸다. 앱이 화면 하나를 열 때 목록을 여러 개 받아 가는데
    # 그대로 보내면 트래픽이 몇 배가 된다(03-api-specification.md 1장).
    # 사진·동영상은 이미 압축돼 있어 CPU 만 쓰므로 gzip_types 에 넣지 않고,
    # 파일을 보내는 /_protected_uploads/ 에서는 아예 끈다.
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    location = /health {
        proxy_pass http://daymo_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    # DB 까지 보는 health 는 밖에 열지 않는다. 컨테이너 HEALTHCHECK 와 배포
    # 스크립트가 안에서 부른다(app/api/v1/health.py). 아래 /v1/ 이 그대로
    # 넘기고 있어서 실제로는 밖에서도 보이던 것을 여기서 막는다.
    location = /v1/health {
        return 404;
    }

    # 소셜 로그인 callback 주소에는 제공자가 준 1회용 code 가 ?code= 로 붙는다.
    # 메일 링크처럼 경로만 적는다. 나머지 설정은 /v1/ 과 같다.
    # 429 를 돌려줄 때만 쓰는 자리. 여기서만 CORS 머리를 직접 붙인다.
    location @rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin $daymo_cors_origin always;
        add_header Vary Origin always;
        add_header Retry-After 1 always;
        return 429 '{"error":{"code":"RATE_LIMITED","message":"잠시 후 다시 시도해 주세요."}}';
    }

    location /v1/auth/oauth/ {
        limit_req zone=daymo_api burst=90 nodelay;
        access_log /var/log/nginx/access.log daymo_no_query;
        proxy_pass http://daymo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /v1/ {
        limit_req zone=daymo_api burst=90 nodelay;
        # 제한에 걸린 429 에도 CORS 머리를 붙인다. 없으면 브라우저가 응답을 버려서
        # 앱이 「연결이 끊겼다」로 읽고 다시 보내지 않는다(mobile/src/requestQueue.ts).
        error_page 429 = @rate_limited;
        proxy_pass http://daymo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /auth/ {
        limit_req zone=daymo_auth_pages burst=10 nodelay;
        access_log /var/log/nginx/access.log daymo_no_query;
        proxy_pass http://daymo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 사진 파일. API 가 공간 멤버인지 본 뒤 `X-Accel-Redirect: /_protected_uploads/...` 로 넘기면
    # nginx 가 보낸다(PHOTO_ACCEL_PREFIX 를 넣었을 때만. 비어 있으면 API 가 직접 보낸다).
    # internal 이라 밖에서 이 주소로 바로 부르면 404 다.
    #
    # - Content-Type·Cache-Control 은 API 응답 머리를 nginx 가 그대로 옮긴다(X-Accel-Redirect 때
    #   옮기는 머리: Content-Type, Content-Disposition, Accept-Ranges, Set-Cookie, Cache-Control,
    #   Expires). Content-Type 이 이미 있으면 확장자로 다시 정하지 않는다.
    # - X-Content-Type-Options 는 옮기지 않지만 아래 server 의 add_header 가 붙인다. 여기에
    #   add_header 를 하나라도 쓰면 server 의 add_header 가 모두 빠지므로 쓰지 않는다.
    # - Range·ETag·If-None-Match 는 nginx 정적 파일 처리가 맡는다.
    # - 파일은 uid 10001, 그룹 101(nginx), 폴더 2750·파일 0640 이다(06-vps-deployment.md 6장).
    location ^~ /_protected_uploads/ {
        internal;
        alias /srv/daymo/uploads/;
        # 사진·동영상은 이미 압축돼 있다. 다시 압축하면 CPU 만 쓰고 크기는 그대로다.
        gzip off;
        sendfile on;
        tcp_nopush on;
        # 내부 주소(trips/{tripId}/{photoId}/{variant})만 적는다. 쿼리는 적지 않는다.
        access_log /var/log/nginx/access.log daymo_no_query;
    }

    location / {
        return 404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=15552000" always;
}
