name: daymo

# 컨테이너 로그(접속 IP·요청 경로가 들어 있다)는 journald 로 보낸다. 보관 기간은
# journald 설정(journald-daymo.conf)이 정한다. json-file 은 용량으로만 지워져, 요청이
# 적으면 몇 달 전 기록이 남는다. 개인정보 처리방침에 3개월을 넘기지 않는다고 적었다.
x-logging: &logging
  driver: journald
  options:
    tag: "daymo-{{.Name}}"

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 800m
    logging: *logging
    networks: [private]

  api:
    image: ${DAYMO_IMAGE:-daymo-api:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      REFRESH_TOKEN_PEPPER: ${REFRESH_TOKEN_PEPPER}
      # 비어 있으면 오류 수집이 꺼진다(app/core/observability.py). compose 는 여기 적힌
      # 것만 컨테이너에 넘기므로, runtime.env 에만 넣어 두면 켜지지 않는다.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-Daymo <no-reply@daymo.xyz>}
      UPLOAD_ROOT: /srv/daymo/uploads
      # 넣으면 사진 파일을 nginx 가 보낸다(X-Accel-Redirect). 비어 있으면 API 가 직접 보낸다.
      # 켜기 전에 호스트 권한부터 맞춘다(docs/development/06-vps-deployment.md 6장).
      PHOTO_ACCEL_PREFIX: ${PHOTO_ACCEL_PREFIX:-}
      # 소셜 로그인. 비어 있는 제공자는 꺼진다. APPLE_PRIVATE_KEY 는 줄바꿈을 \n 으로 적은 한 줄이다.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      OAUTH_APP_REDIRECT_URIS: ${OAUTH_APP_REDIRECT_URIS:-daymo://oauth,https://www.daymo.xyz/oauth,https://daymo.xyz/oauth}
      # 브라우저에서 API 를 부를 수 있는 웹 주소. 미리보기 주소를 잠시 더할 때는
      # runtime.env 에 CORS_ORIGINS 를 적고 api 를 다시 띄운다.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://www.daymo.xyz,https://daymo.xyz}
    volumes:
      - /srv/daymo/uploads:/srv/daymo/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # 2026-09-17에 400m 에서 올렸다. 놀 때 236MiB 를 쓰는데, 사진을 받으면 워커 둘이
    # 각각 최대 70MiB 를 더 쓴다(8M 픽셀 PNG 실측). 합쳐 376MiB 라 400m 에서는 여유가
    # 24MiB 뿐이고, 넘으면 죽지는 않아도(도커 기본값이 RAM 만큼 스왑을 더 준다) 스왑으로
    # 밀려 사진 처리가 느려진다. 512m 이면 여유가 136MiB 라 스왑 없이 끝난다.
    #
    # 더 올리지 않는다. 호스트가 1,967MiB 뿐이라 컨테이너가 죽는 것보다 호스트가 죽는
    # 것이 훨씬 나쁘다(커널이 postgres 를 고를 수도 있다). 상한을 전부 더해도
    # 512+800+128=1,440 이고 OS 가 쓰는 450 을 더하면 1,890 으로 호스트 안에 남는다.
    mem_limit: 512m
    logging: *logging
    security_opt:
      - no-new-privileges:true
    networks: [private]

  nginx:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # X-Accel-Redirect 로 사진을 보낼 때만 읽는다. 쓰기는 API 만 한다.
      - /srv/daymo/uploads:/srv/daymo/uploads:ro
    depends_on:
      api:
        condition: service_healthy
    # 2026-09-17에 64m 에서 올렸다. 그날 `PHOTO_ACCEL_PREFIX` 를 켜면서 사진을 nginx 가
    # 직접 보내게 됐고, 켜자마자 36MiB(64m 의 57%)를 썼다. 파일 자체는 sendfile 이라
    # 메모리에 담기지 않지만 연결마다 버퍼가 붙어서, 여럿이 한꺼번에 받을 때 여유가 없었다.
    mem_limit: 128m
    logging: *logging
    networks: [private]

networks:
  private:
    driver: bridge

volumes:
  postgres-data:
