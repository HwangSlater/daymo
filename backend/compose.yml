# 로컬 개발용 PostgreSQL. 운영 구성은 infra/compose.production.yml 이 따로 맡는다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: daymo
      POSTGRES_USER: daymo
      POSTGRES_PASSWORD: daymo
    ports:
      # 127.0.0.1 을 붙여 이 PC 안에서만 열리게 한다. "5432:5432" 로 쓰면
      # 0.0.0.0 에 바인딩돼 같은 공유기 아래의 다른 기기가 붙을 수 있다.
      - "127.0.0.1:5432:5432"
    volumes:
      - daymo-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daymo -d daymo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daymo-postgres:
