# ASCII only. configparser reads this file with the platform default encoding
# (cp949 on Korean Windows), so non-ASCII characters here break alembic.
# Korean notes live in alembic/env.py instead.
#
# The connection URL is intentionally empty: alembic/env.py builds it from the
# app settings so the password never lands in a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
