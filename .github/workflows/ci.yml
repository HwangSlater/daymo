name: CI

# main push와 모든 pull request에서 클라이언트와 서버 검사를 실행한다.
# feature branch는 pull request에서 검사되므로 push trigger는 main으로 제한해 중복 실행을 피한다.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: client typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 기준은 루트 .nvmrc(24)이며 mobile/package.json engines(">=24 <25")와 같다.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  server:
    name: server test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # DB 테스트는 로컬 PostgreSQL 컨테이너를 쓴다. testcontainers는 쓰지 않는다.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: daymo_test
          POSTGRES_USER: daymo
          POSTGRES_PASSWORD: daymo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U daymo -d daymo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: daymo_test
      DB_USERNAME: daymo
      DB_PASSWORD: daymo
      # DB가 안 떴을 때 테스트를 건너뛰지 않고 실패시킨다. 로컬에서는
      # docker 없이도 나머지가 돌도록 건너뛰지만, CI에서 조용히 통과하면
      # 제약이 깨져도 알 수 없다.
      DAYMO_REQUIRE_DB: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 파이썬 기준은 backend/pyproject.toml의 requires-python(>=3.13)이다.
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Migrate
        run: uv run alembic upgrade head

      - name: Test
        run: uv run pytest
